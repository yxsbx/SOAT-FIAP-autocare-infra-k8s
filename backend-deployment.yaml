apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocarehub-api
  namespace: autocarehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autocarehub-api
  template:
    metadata:
      labels:
        app: autocarehub-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h autocarehub-postgres -U "$DB_USERNAME" -d autocarehub; do sleep 2; done
          env:
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: autocarehub-config
                  key: DB_USERNAME
      containers:
        - name: api
          image: autocarehub-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: autocarehub-config
            - secretRef:
                name: autocarehub-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 768Mi
