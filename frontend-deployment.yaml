apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocarehub-web
  namespace: autocarehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autocarehub-web
  template:
    metadata:
      labels:
        app: autocarehub-web
    spec:
      containers:
        - name: web
          image: autocarehub-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
